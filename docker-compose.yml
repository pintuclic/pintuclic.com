services:
  db:
    image: postgres:15-alpine
    container_name: pintuclic-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pintuclic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pintuclic}
      POSTGRES_DB: ${POSTGRES_DB:-pintuclic}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./bd/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pintuclic} -d ${POSTGRES_DB:-pintuclic}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pintuclic-backend
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-pintuclic}:${POSTGRES_PASSWORD:-pintuclic}@pintuclic-db:5432/${POSTGRES_DB:-pintuclic}?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Pintu Clic <notificaciones@pintuclic.com>"}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://127.0.0.1:3000/api/health", (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on("error", () => process.exit(1))''',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Destino del proxy /api -> backend; se fija al compilar (ver next.config.ts).
        # El navegador llama a /api/v1 en el mismo origen: no se define NEXT_PUBLIC_API_URL.
        BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: pintuclic-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://127.0.0.1:3001", (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on("error", () => process.exit(1))''',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
