name: 🚦 CI — Calidad y seguridad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Las capas aún no existen en el árbol (M20 es el primer módulo en construirse).
  # Este job detecta qué hay realmente y activa los jobs correspondientes.
  detect:
    name: 🔎 Detect layers
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔎 Detect implemented layers
        id: check
        run: |
          if [ -d backend/src ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -d frontend/src/modules ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  ast-quality-audit:
    name: 🛡️ Zero ANY, contratos y accesibilidad
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 📦 Install governance tooling
        run: npm install --no-audit --no-fund

      - name: 🔍 AST Zero ANY audit (backend + frontend + contratos)
        run: npm run check:no-any

      - name: 📋 Validate Zod API & DTO contracts
        run: npm run test:contracts

      - name: ♿ Automated A11y static audit (WCAG 2.1 AA)
        run: npm run audit:a11y

  backend-quality:
    name: ⚙️ Backend — lint, types & tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 📦 Install governance tooling (resuelve typescript del verificador AST)
        run: npm install --no-audit --no-fund

      - name: 📦 Install backend dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: 🔍 Zero ANY (Regla de Oro #11)
        working-directory: backend
        run: npm run check:no-any

      - name: 🧹 ESLint (0 errores / 0 advertencias)
        working-directory: backend
        run: npm run lint -- --max-warnings=0

      - name: 🔎 TypeScript estricto
        working-directory: backend
        run: npm run check:types

      - name: 🧪 Vitest
        working-directory: backend
        run: npm test

  frontend-quality:
    name: 🎨 Frontend — lint, types & tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 📦 Install governance tooling (resuelve typescript del verificador AST)
        run: npm install --no-audit --no-fund

      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: 🔍 Zero ANY (Regla de Oro #11)
        working-directory: frontend
        run: npm run check:no-any

      - name: 🧹 ESLint (0 errores / 0 advertencias)
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: 🔎 TypeScript estricto
        working-directory: frontend
        run: npm run check:types

      - name: 🧪 Vitest
        working-directory: frontend
        run: npm test
