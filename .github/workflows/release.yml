name: Semantic Tagging & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version and create git tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          initial_version: 0.0.1

      - name: Create GitHub release
        if: steps.tag_version.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.tag_version.outputs.new_tag }} \
            --title "Release ${{ steps.tag_version.outputs.new_tag }}" \
            --notes "${{ steps.tag_version.outputs.changelog }}"
