name: CD - Despliegue a VPS (Docker Compose)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 🐳 Compilar y publicar imágenes (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🏷️ Normalizar prefijo de imagen a minúsculas
        id: meta
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Compilar y publicar Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/backend:latest
            ${{ steps.meta.outputs.image_prefix }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Compilar y publicar Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            BACKEND_URL=http://backend:3000
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/frontend:latest
            ${{ steps.meta.outputs.image_prefix }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Despliegue via SSH al VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Ejecutar despliegue en servidor remoto
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # 1. Definicion de rutas y repositorio
            TARGET_DIR="${{ secrets.DEPLOY_PATH || format('/home/{0}/pintuclic', secrets.VPS_USER || secrets.SSH_USER) }}"
            REPO_URL="https://github.com/pintuclic/pintuclic.com.git"

            echo "Ruta de despliegue: $TARGET_DIR"

            # 2. Preparacion: Verificar si el repositorio ya existe en el disco
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Primer despliegue: Creando directorio y clonando repositorio..."
              mkdir -p "$TARGET_DIR"
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"

              if [ -f ".env.example" ]; then
                cp .env.example .env
                echo "Archivo .env creado a partir de .env.example."
              else
                touch .env
                echo "Archivo .env vacio creado."
              fi

              chmod 600 .env
              echo "BLOQUEO DE SEGURIDAD: Se ha detenido el despliegue."
              echo "Entra por SSH a tu VPS, edita el archivo '$TARGET_DIR/.env' con tus credenciales reales y vuelve a ejecutar el pipeline."
              exit 1
            else
              echo "Actualizando repositorio en el servidor..."
              cd "$TARGET_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # 3. Control de seguridad: Verificar que el .env no este vacio antes de levantar
            if [ ! -s ".env" ]; then
              echo "ERROR: El archivo .env de produccion esta vacio o no existe. Abortando despliegue."
              exit 1
            fi

            # 4. Validacion de red externa proxy-network
            echo "Validando configuracion de docker-compose..."
            docker network inspect proxy-network >/dev/null 2>&1 || docker network create proxy-network

            # 5. Iniciar sesion en GHCR para descargar imagenes
            echo "Autenticando en GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 6. Descargar imagenes precompiladas y levantar servicios
            echo "Descargando imagenes precompiladas desde GHCR..."
            docker compose -f docker-compose.yml pull backend frontend

            echo "Levantando contenedores actualizados..."
            docker compose -f docker-compose.yml up -d --remove-orphans

            docker logout ghcr.io || true

            # 7. Migracion automatica: Aplicar esquema incremental sin destruir datos
            echo "Aplicando cambios incrementales al esquema de base de datos..."
            docker compose -f docker-compose.yml exec -T db psql -U pintuclic -d pintuclic -v ON_ERROR_STOP=1 < bd/sql/schema_pintuclic.sql

            # 8. Verificacion de servicios
            echo "Estado de los servicios activos:"
            docker compose -f docker-compose.yml ps

            # 9. Limpieza de imagenes huerfanas
            docker image prune -f

            echo "Despliegue completado con exito en segundos."
